name: diffproj
 
channels:
  - conda-forge
 
dependencies:
  - python=3.14.6
  - pip=26.2
 
  - pip:
      - numpy==2.5.4
      - scipy==1.18.1
      - pillow==13.0.0
      - matplotlib==3.11.2
      - pyyaml==6.0.3

      - diffusers==0.42.1
      - torchmetrics[image]==1.9.0
      - torch-fidelity==0.4.0

      - streamlit==1.67.0
      
      - --extra-index-url https://stable.repo.amd.com/rocm/whl-next/
      - torch[device-gfx1200]==2.13.0+rocm10.0.0 ; sys_platform == "linux"
      - torchvision[device-gfx1200]==0.28.0+rocm10.0.0 ; sys_platform == "linux"
