#config.yaml

paths:
  data_raw: "data/raw"
  data_metadata: "data/metadata"
  data_splits: "data/splits"
  data_processed: "data/processed"
  checkpoints: "checkpoints"
  outputs_checks: "outputs/checks"
  outputs_generated_samples: "outputs/generated_samples"


  csv_filename: "Data_Entry_2017.csv"



data:
  image_size: 64
  batch_size: 64
  num_workers: 4
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15



model:
  in_channels: 3
  out_channels: 3
  layers_per_block: 2
  block_out_channels: [128, 256, 256, 256]
  down_block_types: 
    - "DownBlock2D"
    - "DownBlock2D"
    - "AttnDownBlock2D"
    - "DownBlock2D"
  up_block_types: 
    - "UpBlock2D"
    - "AttnUpBlock2D"
    - "UpBlock2D"
    - "UpBlock2D"



scheduler:
  num_train_timesteps: 1000
  beta_schedule: "squaredcos_cap_v2"
  beta_start: 0.0001
  beta_end: 0.02
  prediction_type: "epsilon"



training:
  epochs: 50
  learning_rate: 0.0002
  weight_decay: 0.01
  max_grad_norm: 1.0
  device: "auto"
  save_every_n_epochs: 5
  log_every_n_steps: 50
  max_batches_per_epoch: 0
  use_ema: true
  ema_decay: 0.999
  lr_warmup_steps: 500



conditional:
  enabled: true
  label_dropout_chance: 0.1
  guidance_scale: 3.0



generation:
  num_images: 8
  batch_size: 4
  num_inference_steps: 1000



seed: 47